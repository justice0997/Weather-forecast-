<div class="weather-container">
  <h1>Weather Finder</h1>
  <div class="search-box">
    <input type="text" id="city-input" placeholder="Enter city name...">
    <button id="search-btn">Search</button>
  </div>
  
  <div class="weather-card" id="weather-card">
    <h2 id="city-name">--</h2>
    <div class="temp-display">
      <span id="temperature">--</span>°C
    </div>
    <p id="description">Search for a city to see the weather</p>
  </div>
</div>

<style>
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1534088568595-a066f410bcda?auto=format&fit=crop&w=1600&q=80');
  background-size: cover;
  background-position: center;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  margin: 0;
  transition: background 0.8s ease;
}

.weather-container {
  background: rgba(15, 23, 42, 0.75);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  padding: 30px;
  border-radius: 16px;
  box-shadow: 0 15px 35px rgba(0,0,0,0.5);
  width: 320px;
  text-align: center;
  border: 1px solid rgba(255, 255, 255, 0.1);
}

h1 {
  margin-bottom: 20px;
  color: #f8fafc;
  font-size: 1.5rem;
}

.search-box {
  display: flex;
  gap: 10px;
  margin-bottom: 25px;
}

input {
  flex: 1;
  padding: 10px;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 8px;
  color: white;
  outline: none;
}

input::placeholder {
  color: #94a3b8;
}

button {
  padding: 10px 15px;
  background-color: #3b82f6;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  background-color: #2563eb;
}

.weather-card {
  background: rgba(30, 41, 59, 0.6);
  padding: 20px;
  border-radius: 12px;
  border: 1px solid rgba(255, 255, 255, 0.05);
}

#city-name {
  color: #f8fafc;
  margin: 0 0 10px 0;
  font-size: 1.25rem;
}

.temp-display {
  font-size: 2.5rem;
  font-weight: bold;
  color: #38bdf8;
  margin: 10px 0;
}

#description {
  color: #94a3b8;
  text-transform: capitalize;
  margin: 0;
}
</style>

<script>
const cityInput = document.getElementById('city-input');
const searchBtn = document.getElementById('search-btn');
const cityNameEl = document.getElementById('city-name');
const temperatureEl = document.getElementById('temperature');
const descriptionEl = document.getElementById('description');

async function fetchWeather() {
    const city = cityInput.value.trim();
    if (!city) return;

    cityNameEl.textContent = "Loading...";
    temperatureEl.textContent = "--";
    descriptionEl.textContent = "Fetching live data...";

    try {
        const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1`);
        const geoData = await geoRes.json();

        if (!geoData.results || geoData.results.length === 0) {
            throw new Error("City not found");
        }

        const { latitude, longitude, name, country } = geoData.results[0];

        const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true`);
        const weatherData = await weatherRes.json();

        const temp = weatherData.current_weather.temperature;

        cityNameEl.textContent = `${name}, ${country || ''}`;
        temperatureEl.textContent = temp;
        descriptionEl.textContent = "Current Temperature";

        let bgUrl = "";
        if (temp > 25) {
            bgUrl = "https://images.unsplash.com/photo-1569336415962-a4bd9f69cd83?auto=format&fit=crop&w=1600&q=80";
        } else if (temp < 15) {
            bgUrl = "https://images.unsplash.com/photo-1517783997329-87c2fb376510?auto=format&fit=crop&w=1600&q=80";
        } else {
            bgUrl = "https://images.unsplash.com/photo-1534088568595-a066f410bcda?auto=format&fit=crop&w=1600&q=80";
        }

        document.body.style.background = `linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('${bgUrl}')`;
        document.body.style.backgroundSize = "cover";
        document.body.style.backgroundPosition = "center";

    } catch (err) {
        cityNameEl.textContent = "Error";
        temperatureEl.textContent = "--";
        descriptionEl.textContent = "Could not find that city. Try again!";
    }
}

searchBtn.addEventListener('click', fetchWeather);

cityInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
        fetchWeather();
    }
});
</script>
